server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets. No build step means no hashed filenames, so don't cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # The frontend talks to the Twin API on the same origin. That removes CORS
    # entirely and means the demo has exactly ONE url to remember.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Seeding on first boot, and a benchmark re-run, can take a while.
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # FastAPI's interactive docs, proxied so the API is explorable from one host.
    location = /docs        { proxy_pass http://backend:8000/docs; }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }
    location /redoc          { proxy_pass http://backend:8000/redoc; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
